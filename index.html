<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cina 2026">
<title>Cina · 6–19 settembre 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --ink:#14201D;
  --ink-2:#33443E;
  --mute:#6E7F78;
  --celadon:#D9E2DC;
  --paper:#F4F7F3;
  --line:#C2D0C8;
  --line-soft:#DCE5DF;
  --cinnabar:#BC3B2E;
  --jade:#3F7264;
  --gold:#9C7B33;
  --display:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --body:-apple-system,system-ui,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  --bar:calc(58px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--celadon);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px;border-radius:2px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--ink);
  color:var(--paper);
  padding:calc(10px + env(safe-area-inset-top)) 0 0;
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.brandrow{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 16px 10px;
}
.brand{
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:#9FB3AB;
}
.brand b{color:var(--paper);font-weight:500}
.countdown{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#9FB3AB;
}
.countdown span{color:var(--cinnabar);font-weight:500}

.rail{
  display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;
  padding:0 16px 12px;scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;scroll-snap-align:center;
  border:1px solid rgba(244,247,243,.22);
  background:transparent;color:#B9C9C2;
  border-radius:3px;padding:5px 9px 6px;
  font-family:var(--mono);font-size:11px;line-height:1.25;
  text-align:center;cursor:pointer;min-width:46px;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.chip .wd{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.chip .dn{display:block;font-size:14px;font-weight:500}
.chip[aria-selected="true"]{
  background:var(--cinnabar);border-color:var(--cinnabar);color:#fff;
}
.chip.transfer::after{
  content:"";display:block;height:2px;width:14px;margin:3px auto 0;
  background:currentColor;opacity:.55;
}

/* ---------- layout ---------- */
main{padding:0 0 var(--bar)}
.wrap{padding:18px 16px 26px;max-width:640px;margin:0 auto}

/* ---------- day head ---------- */
.dayhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.seal{
  flex:0 0 auto;width:56px;height:56px;border-radius:3px;
  background:var(--cinnabar);color:#fff;
  display:grid;place-items:center;
  font-family:var(--display);font-size:23px;line-height:1;font-weight:600;
  transform:rotate(-1.5deg);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), 0 2px 0 rgba(20,32,29,.12);
}
.seal.sm{width:38px;height:38px;font-size:16px}
.dayhead h1{
  font-family:var(--display);font-weight:600;
  font-size:26px;line-height:1.12;margin:2px 0 4px;letter-spacing:-.01em;
}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);
}
.base{color:var(--jade);font-weight:500}
.narr{
  font-size:15px;color:var(--ink-2);margin:0 0 16px;
  padding-left:2px;
}

/* ---------- transfer strip ---------- */
.trstrip{
  border:1px solid var(--line);border-left:3px solid var(--jade);
  background:var(--paper);border-radius:3px;
  padding:11px 13px;margin:0 0 18px;
}
.trstrip .lbl{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--jade);display:block;margin-bottom:3px;
}
.trstrip .route{font-weight:600;font-size:15px;display:block}
.trstrip .det{font-size:13.5px;color:var(--ink-2);display:block;margin-top:2px}

/* ---------- stops ---------- */
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:50px 1fr;column-gap:12px;position:relative}
.stop .time{
  font-family:var(--mono);font-size:12.5px;color:var(--ink);
  padding-top:14px;text-align:right;font-weight:500;
}
.thread{position:relative}
.thread::before{
  content:"";position:absolute;left:-12px;top:0;bottom:0;width:1px;background:var(--line);
}
.stop:first-child .thread::before{top:20px}
.stop:last-child .thread::before{bottom:auto;height:20px}
.thread::after{
  content:"";position:absolute;left:-15px;top:18px;width:7px;height:7px;
  border-radius:50%;background:var(--celadon);border:1.5px solid var(--jade);
}
.stop.opt .thread::after{border-color:var(--gold);border-style:dashed}
.card{padding:12px 0 20px}
.card h2{
  font-family:var(--display);font-size:18.5px;font-weight:600;
  margin:0 0 5px;line-height:1.2;letter-spacing:-.005em;
}
.card p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.52}
.tag{
  display:inline-block;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold);border-radius:2px;padding:1px 5px;
  vertical-align:2px;margin-left:6px;
}
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.act{
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;
  border:1px solid var(--line);background:var(--paper);color:var(--jade);
  border-radius:3px;padding:5px 9px;text-decoration:none;cursor:pointer;
  display:inline-block;
}
.act:active{background:var(--line-soft)}

/* ---------- nav ---------- */
.pager{display:flex;gap:10px;margin-top:6px}
.pager button{
  flex:1;font-family:var(--body);font-size:14px;font-weight:500;
  background:var(--paper);border:1px solid var(--line);color:var(--ink);
  border-radius:3px;padding:12px 10px;cursor:pointer;text-align:left;
}
.pager button:disabled{opacity:.35;cursor:default}
.pager button .k{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin-bottom:2px;
}
.pager .next{text-align:right}

/* ---------- logistica ---------- */
h3.sec{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);
  margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);
}
h3.sec:first-of-type{margin-top:6px}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:3px;overflow:hidden}
.row{background:var(--paper);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.row .k{font-weight:600;font-size:14.5px}
.row .v{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-align:right;white-space:nowrap}
.row .d{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.row.done .k::after{content:" ✓";color:var(--jade)}
.row.hot{border-left:3px solid var(--cinnabar)}
.row.hot .v{color:var(--cinnabar)}
.note{font-size:13px;color:var(--mute);margin:10px 2px 0;line-height:1.5}

/* ---------- mappa ---------- */
/* ---------- salto fra una tappa e l'altra ---------- */
.gap{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
  color:var(--mute);margin:12px 0 0;display:flex;align-items:center;gap:6px;
}
.gap::before{content:"";width:14px;height:1px;background:var(--line);flex:0 0 auto}
.gap.far{color:var(--gold)}

/* ---------- dove sei adesso ---------- */
.stop.now .card h2{color:var(--cinnabar)}
.stop.now .thread::after{
  background:var(--cinnabar);border-color:var(--cinnabar);
  box-shadow:0 0 0 3px rgba(188,59,46,.18);
}
.nowtag{
  display:inline-block;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;
  background:var(--cinnabar);border-radius:2px;padding:1px 5px;
  vertical-align:2px;margin-left:6px;
}
.pin--now{box-shadow:0 0 0 2px var(--paper),0 0 0 6px rgba(188,59,46,.28),0 1px 3px rgba(20,32,29,.4)}

/* ---------- scarica le mappe ---------- */
.dl button{
  width:100%;font-family:var(--body);font-size:14px;font-weight:500;
  background:var(--paper);border:1px solid var(--line);color:var(--ink);
  border-radius:3px;padding:12px 10px;cursor:pointer;
}
.dl button:disabled{opacity:.6;cursor:default}
.dl button.done{border-color:var(--jade);color:var(--jade)}
.dl .bar{height:2px;background:var(--line-soft);border-radius:2px;margin-top:6px;overflow:hidden}
.dl .bar i{display:block;height:100%;width:0;background:var(--jade);transition:width .2s linear}

/* ---------- guida dentro un sito ---------- */
/* La mappa resta in vista mentre si legge: camminando serve sempre, e i punti
   sono a 60 m l'uno dall'altro — a vederli tutti insieme si accavallano, quindi
   e' la mappa a seguire la lettura invece del contrario. */
.gmap{position:sticky;top:var(--headh,120px);z-index:6;background:var(--celadon);padding:6px 0 10px}
.gmap .map{height:230px}
.gpunto.on h2{color:var(--cinnabar)}
.gpunto.on .gnum{box-shadow:0 0 0 4px rgba(188,59,46,.2)}
.act.guida{border-color:var(--cinnabar);color:var(--cinnabar)}
.gintro{font-size:15px;color:var(--ink-2);margin:0 0 18px;line-height:1.55}
.gpunto{display:grid;grid-template-columns:26px 1fr;column-gap:12px;margin:0 0 22px}
.gnum{
  width:26px;height:26px;border-radius:50%;background:var(--cinnabar);color:#fff;
  display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;
  margin-top:2px;
}
.gpunto h2{
  font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 2px;line-height:1.2;
}
.gpunto .zh{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mute);
  display:block;margin-bottom:6px;
}
.gpunto p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.52}
.gpunto .acts{margin-top:8px}
.gcoda{
  border-left:3px solid var(--gold);background:var(--paper);border:1px solid var(--line);
  border-left:3px solid var(--gold);border-radius:3px;padding:11px 13px;
  font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:4px 0 0;
}
.gback{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;color:var(--jade);cursor:pointer;padding:0;margin:0 0 12px;
}
.avviso{
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--mute);
  line-height:1.5;margin:18px 2px 0;
}

.mapwrap{margin:0 0 18px}
.maplab{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--jade);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:0 0 6px;
}
.maplab .span{color:var(--mute);letter-spacing:.06em;text-transform:none;font-size:10.5px}
.map{
  height:250px;border:1px solid var(--line);border-radius:3px;
  background:var(--paper);overflow:hidden;
}
.map.tall{height:340px}
/* I tile Amap sono più squillanti della pagina: si smorzano un filo per
   farli stare dentro la stessa tavolozza senza perdere leggibilità. */
.map .leaflet-tile-pane{filter:saturate(.82) contrast(1.02)}
.map .leaflet-container{background:var(--paper);font-family:var(--body)}
.mapfoot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--mute);margin-top:5px;
}
.mapfoot button{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--paper);border:1px solid var(--line);color:var(--jade);
  border-radius:2px;padding:3px 7px;cursor:pointer;
}
.mapfoot .off{color:var(--gold)}

/* segnaposto */
.pin{
  display:grid;place-items:center;
  width:26px;height:26px;border-radius:50%;
  background:var(--cinnabar);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:500;line-height:1;
  box-shadow:0 0 0 2px var(--paper),0 1px 3px rgba(20,32,29,.4);
  transition:transform .16s ease;
}
.pin--opt{background:var(--gold)}
.pin--on{transform:scale(1.28)}
.pin--base{background:var(--ink)}
.pin--base.pin--here{background:var(--cinnabar)}
.row .num{
  display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;
  background:var(--ink);color:var(--paper);
  font-family:var(--mono);font-size:10px;font-style:normal;font-weight:500;
  margin-right:7px;vertical-align:1px;
}
.row.hot .num{background:var(--cinnabar)}
.row[data-base]{cursor:pointer}
.stop.on .card h2{color:var(--cinnabar)}
.stop.on .thread::after{background:var(--cinnabar);border-color:var(--cinnabar)}

/* controlli Leaflet, ridisegnati come il resto */
.map .leaflet-control-zoom a{
  background:var(--paper);color:var(--ink);border-color:var(--line);
  font-family:var(--body);font-weight:400;
}
.map .leaflet-control-zoom a:hover{background:var(--line-soft)}
.map .leaflet-control-scale-line{
  border-color:var(--mute);color:var(--ink-2);background:rgba(244,247,243,.78);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
}
.map .leaflet-control-attribution{
  background:rgba(244,247,243,.8);font-family:var(--mono);font-size:9px;color:var(--mute);
}
.map .leaflet-control-attribution a{color:var(--jade)}

/* ---------- bottom bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--ink);
  display:flex;align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom);
}
.bar button{
  flex:1;background:none;border:0;color:#9FB3AB;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;padding:18px 4px;cursor:pointer;
}
.bar button[aria-current="page"]{color:var(--paper);box-shadow:inset 0 -2px 0 var(--cinnabar)}
.bar .arrow{flex:0 0 52px;font-size:18px;letter-spacing:0;color:#9FB3AB}
.bar .arrow:disabled{opacity:.28}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--bar) + 14px);transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;
  padding:9px 14px;border-radius:3px;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;z-index:40;max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <div class="brand">Cina · <b>Pechino → Hong Kong</b></div>
    <div class="countdown" id="countdown"></div>
  </div>
  <div class="rail" id="rail" role="tablist" aria-label="Giorni del viaggio"></div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<nav class="bar">
  <button class="arrow" id="prev" aria-label="Giorno precedente">‹</button>
  <button id="tabDays" aria-current="page">Giorni</button>
  <button id="tabMap">Mappa</button>
  <button id="tabLog">Logistica</button>
  <button class="arrow" id="next" aria-label="Giorno successivo">›</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="leaflet.js"></script>
<script type="module">
const CN = ["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四"];

const DAYS = [
{date:"2026-09-06", wd:"dom", title:"Arrivo a Pechino", base:"Pechino",
 narr:"Atterraggio nel primo pomeriggio, in centro verso le 17:30. Tutto entro 800 metri, niente prenotazioni, nessuna sveglia.",
 stops:[
  {t:"18:00", n:"Siji Minfu (Qianmen)", ll:[39.897062,116.39717], d:"Prima tappa solo per ritirare il numero: non si prenota e si aspetta 1–3 ore. Giri e torni verso le 20:00. Anatra laccata."},
  {t:"18:15", n:"Yangmeizhu Xiejie", ll:[39.89556,116.39194], d:"Vicolo obliquo dentro Dashilan, rimesso a posto senza svuotarlo: librerie, caffè, gente che ci vive."},
  {t:"19:15", n:"Beijing Fang", ll:[39.89871,116.3954], d:"Terrazze su un blocco anni '20 restaurato. Tramonto verso le 18:35, con Zhengyangmen che si illumina davanti."},
  {t:"21:15", n:"Zhengyangmen", ll:[39.900558,116.397846], d:"Risali Qianmen Street fino in fondo. Torre e torre delle frecce illuminate. Poi a letto: domani si comincia tardi apposta."}
 ]},

{date:"2026-09-07", wd:"lun", title:"Lama, Palazzo d'Estate e i laghi", base:"Pechino",

 stops:[
  {t:"09:30", n:"Tempio dei Lama", ll:[39.9476712,116.4172902], d:"Partenza clemente: è il tuo secondo giorno e il corpo pensa che siano le 3:30 del mattino. Maitreya di 18 metri da un unico tronco di sandalo. Accanto il Tempio di Confucio."},

 ]},

{date:"2026-09-08", wd:"mar", title:"Asse imperiale", base:"Pechino",
 narr:"Cinque tappe su un asse di tre chilometri, quasi tutto a piedi, e finisce a due passi da dove dormi.",
 stops:[
  {t:"08:30", n:"Città Proibita", ll:[39.9168038,116.3971621], d:"Biglietto online 7 giorni prima. Entra da sud all'apertura, percorso a senso unico verso nord. Prenotazione Tian'anmen separata, da fare 1–7 giorni prima."},
  {t:"12:15", n:"Jingshan Park", ll:[39.9250988,116.3968433], d:"Fuori dall'uscita nord. 15 minuti di salita per la vista simmetrica su quello che hai appena percorso."},
  {t:"13:45", n:"Beihai Park", ll:[39.9254474,116.3892639], d:"Lago imperiale con la pagoda bianca sull'isola. Traversata in barca per risparmiare gambe."},
  {t:"16:00", n:"Torre del Tamburo e della Campana", ll:[39.9407055,116.3958979], d:"Estremo nord dell'asse imperiale, e a cinque minuti dall'albergo. Scala ripida, vista su tutti gli hutong."},
  {t:"18:00", n:"Nanluoguxiang", ll:[39.9334746,116.4133492], d:"Un chilometro a est, a piedi. Cena nei vicoli laterali, non sulla via principale. Rientro presto: domani sveglia alle 5."}
 ]},

{date:"2026-09-09", wd:"mer", title:"Muraglia a Jinshanling", base:"Pechino",
 narr:"Muraglia selvaggia invece di Mutianyu. È la giornata più dura e sta al quarto giorno apposta.",
 stops:[

import {
  toGCJ, toWGS, haversine, splitFrames, frameLabels, boundsOf, fmtDistance,
  walkMinutes, currentStopIndex, fitZoom, viewportTiles
} from "./geo.js";
import { GUIDE } from "./guida.js";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const view = $("#view"), rail = $("#rail");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let day = 0, tab = "days";

/* Nomi delle otto basi: servono a riconoscere che "volo serale" non è un posto. */
const NOMI_BASI = new Set(BASI.map(b => b[0]));

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._x); t._x = setTimeout(()=>t.classList.remove("on"), 1900);
}
function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  return d + " " + mesi[m-1];
}
/* Amap vuole GCJ-02, Google vuole WGS-84. Le coordinate salvate sono GCJ nel
   continente e WGS a Hong Kong: geo.js normalizza, così per la prima volta
   tutti e due i pulsanti puntano al posto giusto. */
function amap(ll,n){ const g = toGCJ(ll); return "https://uri.amap.com/marker?position=" + g[1] + "," + g[0] + "&name=" + encodeURIComponent(n); }
function gmap(ll){ const w = toWGS(ll); return "https://www.google.com/maps/search/?api=1&query=" + w[0] + "," + w[1]; }
function coordText(ll){ const g = toGCJ(ll); return g[0].toFixed(6) + ", " + g[1].toFixed(6); }

/* ---------- mappa ---------- */
const TILE = "https://webrd0{s}.is.autonavi.com/appmaptile?lang={lang}&size=1&scale=1&style=8&x={x}&y={y}&z={z}";
const LANG_KEY = "cina2026.maplang";
let mapLang = localStorage.getItem(LANG_KEY) || "en";
let liveMaps = [];

function killMaps(){
  liveMaps.forEach(m => { try { m.remove(); } catch(e){} });
  liveMaps = [];
}

function tileLayer(){
  return L.tileLayer(TILE.replace("{lang}", mapLang === "zh" ? "zh_cn" : "en"), {
    subdomains: ["1","2","3","4"],
    minZoom: 3, maxZoom: 18,
    crossOrigin: true,
    attribution: "&copy; 高德地图 AutoNavi"
  });
}

/**
 * Disegna una mappa dentro `el`.
 * points: [{ll, label, opt, onSelect}]  — già in coordinate salvate
 * Se i tile non arrivano (aereo, Grande Firewall, niente rete) restano
 * comunque il tracciato, i numeri e la barra di scala: la mappa non
 * diventa mai un rettangolo vuoto.
 */
function drawMap(el, points, opts){
  opts = opts || {};
  const latlngs = points.map(p => toGCJ(p.ll));
  const b = boundsOf(latlngs, opts.pad);
  const map = L.map(el, {
    zoomControl: opts.zoomControl !== false,
    scrollWheelZoom: false,
    attributionControl: true,
    tap: true
  });
  liveMaps.push(map);
  // attributionControl è un booleano: il prefisso si toglie dal controllo.
  if (map.attributionControl) map.attributionControl.setPrefix("");
  map.fitBounds(b, { padding: [12,12], maxZoom: opts.maxZoom || 16 });

  const tiles = tileLayer();
  let failed = 0;
  tiles.on("tileerror", () => {
    if (++failed === 3 && opts.onOffline) opts.onOffline();
  });
  tiles.addTo(map);

  if (latlngs.length > 1 && !opts.noRoute) {
    L.polyline(latlngs, {
      color: opts.legColor || "#3F7264",
      weight: 2, opacity: .8,
      dashArray: opts.dashed ? "5,5" : null
    }).addTo(map);
  }

  const markers = points.map((p, i) => {
    const icon = L.divIcon({
      className: "",
      html: '<div class="pin' + (p.opt ? " pin--opt" : "") + (p.base ? " pin--base" : "")
          + (p.here ? " pin--here" : "") + '">' + esc(p.label) + "</div>",
      iconSize: [26,26],
      iconAnchor: [13,13]
    });
    const m = L.marker(latlngs[i], { icon, title: p.title || "", keyboard: true }).addTo(map);
    if (p.onSelect) m.on("click", () => p.onSelect(i));
    return m;
  });

  // Il contenitore nasce dentro innerHTML: senza questo Leaflet misura 0.
  requestAnimationFrame(() => map.invalidateSize());
  L.control.scale({ metric: true, imperial: false, position: "bottomleft" }).addTo(map);
  return { map, markers };
}

/* ---------- scaricare tutte le mappe in anticipo ---------- */

/** Misurate sul telefono: il contenitore della mappa e' 356x248. */
const MAP_W = 356, MAP_H = 248;

/**
 * Ogni riquadro che l'app potrà mostrare: le giornate, la panoramica, e due
 * livelli di zoom in più per quando ci si avvicina. In tutte e due le lingue,
 * altrimenti chi cambia lingua in Cina si ritrova la cache vuota.
 */
function allTiles(){
  const viste = [];
  DAYS.forEach((d, i) => {
    splitFrames(d.stops).forEach(f => {
      const pts = f.filter(x => x.ll).map(x => toGCJ(x.ll));
      if(pts.length) viste.push({ b: boundsOf(pts), max: pts.length === 1 ? 13 : 16 });
    });
  });
  const cents = [...baseCentroids().values()];
  if(cents.length) viste.push({ b: boundsOf(cents, 0.10), max: 9 });

  const chiavi = new Set();
  viste.forEach(v => {
    const z = fitZoom(v.b, MAP_W, MAP_H, v.max);
    for(let zz = z; zz <= Math.min(z + 2, 18); zz++)
      viewportTiles(v.b, zz, MAP_W, MAP_H).forEach(t => chiavi.add(`${t.z}/${t.x}/${t.y}`));
  });

  const urls = [];
  chiavi.forEach(k => {
    const [z, x, y] = k.split("/");
    ["en", "zh_cn"].forEach(lang => {
      const sub = (Number(x) + Number(y)) % 4 + 1;
      urls.push(`https://webrd0${sub}.is.autonavi.com/appmaptile?lang=${lang}&size=1&scale=1&style=8&x=${x}&y=${y}&z=${z}`);
    });
  });
  return urls;
}

/** Scarica tutto, sei alla volta. Il service worker li mette in cache da sé. */
async function scaricaMappe(onProgress){
  const urls = allTiles();
  let fatti = 0;
  async function passata(lista){
    const falliti = [];
    let i = 0;
    async function worker(){
      while(i < lista.length){
        const u = lista[i++];
        try {
          const r = await fetch(u, { mode: "cors", cache: "default" });
          if(!r || !r.ok) falliti.push(u);
        } catch(e) { falliti.push(u); }
        onProgress(Math.min(++fatti, urls.length), urls.length);
      }
    }
    await Promise.all(Array.from({ length: 6 }, worker));
    return falliti;
  }
  // Una seconda passata sui caduti: così "Fatto" vuol dire davvero fatto.
  const falliti = await passata(urls);
  if(falliti.length){ fatti -= falliti.length; await passata(falliti); }
  return urls.length;
}

/** Estensione del riquadro, per l'etichetta ("1,7 km"). */
function frameSpan(stops){
  const pts = stops.filter(s => s.ll).map(s => s.ll);
  if (pts.length < 2) return "";
  let max = 0;
  for (let i = 0; i < pts.length; i++)
    for (let j = i+1; j < pts.length; j++)
      max = Math.max(max, haversine(pts[i], pts[j]));
  return fmtDistance(max);
}

/* ---------- render ---------- */
function renderRail(){
  rail.innerHTML = DAYS.map((d,i) => `
    <button class="chip${d.tr?" transfer":""}" role="tab" aria-selected="${i===day&&tab==="days"}" data-i="${i}">
      <span class="wd">${d.wd}</span><span class="dn">${Number(d.date.slice(8))}</span>
    </button>`).join("");
  const act = rail.querySelector('[aria-selected="true"]');
  if(act) act.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
}

/** Quanto c'è fino alla tappa dopo, e se ci si va a piedi. */
function gapLine(from, to){
  if(!from || !to || !from.ll || !to.ll) return "";
  const m = haversine(from.ll, to.ll);
  const min = walkMinutes(m);
  const testo = min !== null
    ? `${fmtDistance(m)} · ${min} min a piedi`
    : `${fmtDistance(m)} · metro o taxi`;
  return `<div class="gap${min === null ? " far" : ""}">${esc(testo)}</div>`;
}

function transferStrip(d){
  return `<div class="trstrip">
      <span class="lbl">Treno</span>

function renderDay(){
  const d = DAYS[day];
  const frames = splitFrames(d.stops);
  const labels = frameLabels(d, frames, DAYS[day-1], NOMI_BASI);

  // Qual è la tappa di adesso: solo se il giorno mostrato è davvero oggi.
  const tappaAdesso = stopOfNow(d);

  // Numerazione continua su tutta la giornata, non per riquadro.
  let counter = 0;
  const numbered = frames.map(f => f.map(s => ({ s, n: s.ll ? ++counter : null })));

  const blocks = numbered.map((f, i) => {
    const withLL = f.filter(x => x.n !== null);
    const span = frameSpan(f.map(x => x.s));
    const mapHTML = withLL.length ? `
      <div class="mapwrap">
        <div class="maplab">
          <span>${esc(labels[i] || "")}</span>
          ${span ? `<span class="span">${esc(span)} da capo a fondo</span>` : ""}
        </div>
        <div class="map" id="map${i}"></div>
        <div class="mapfoot">
          <span id="mapnote${i}"></span>
          <button data-lang>${mapLang === "zh" ? "中文" : "English"}</button>
        </div>
      </div>` : "";
    // Il treno sta fra i due riquadri: è lì che succede.
    const tr = (i === 1 && d.tr && frames.length === 2) ? transferStrip(d) : "";
    return tr + mapHTML + `<ul class="stops">${
      f.map((x, k) => stopItem(x.s, x.n, f[k+1] && f[k+1].s, x.s === tappaAdesso)).join("")
    }</ul>`;
  }).join("");

  view.innerHTML = `
    <div class="dayhead">
      <div class="seal">${CN[day]}</div>
      <div>
        <div class="eyebrow">Giorno ${day+1} di 14 · ${d.wd} ${fmtDate(d.date)} · <span class="base">${esc(d.base)}</span></div>
        <h1>${esc(d.title)}</h1>
      </div>
    </div>
    ${d.tr && frames.length < 2 ? transferStrip(d) : ""}
    ${d.narr ? `<p class="narr">${esc(d.narr)}</p>` : ""}
    ${blocks}
    <div class="pager">
      <button id="pPrev" ${day===0?"disabled":""}><span class="k">Prima</span>${day>0?esc(DAYS[day-1].title):"—"}</button>
      <button class="next" id="pNext" ${day===DAYS.length-1?"disabled":""}><span class="k">Poi</span>${day<DAYS.length-1?esc(DAYS[day+1].title):"—"}</button>
    </div>`;

  numbered.forEach((f, i) => {
    const withLL = f.filter(x => x.n !== null);
    const el = $("#map" + i);
    if (!el || !withLL.length) return;
    const note = $("#mapnote" + i);
    const drawn = drawMap(el, withLL.map(x => ({
      ll: x.s.ll, label: String(x.n), opt: !!x.s.opt, title: x.s.n,
      onSelect: () => selectStop(x.n)
    })), {
      // Una tappa sola (Jinshanling, la base dei panda) sta fuori città: se ci
      // si avvicina troppo si vede solo bosco. Meglio stare larghi e mostrare
      // le strade intorno, che è l'unica cosa che serve sapere.
      maxZoom: withLL.length === 1 ? 13 : 16,
      onOffline: () => { if (note) { note.textContent = "senza rete · solo posizioni"; note.className = "off"; } }
    });
    frameMarkers.set(i, { drawn, nums: withLL.map(x => x.n) });
  });

  const pp = $("#pPrev"), pn = $("#pNext");
  if(pp) pp.onclick = () => go(day-1);
  if(pn) pn.onclick = () => go(day+1);
  window.scrollTo({top:0, behavior:"instant"});
  markNow();
}

const frameMarkers = new Map();
let primoAvvio = true;

/**
 * La tappa di "adesso", ma solo se il giorno mostrato è oggi davvero.
 * Sfogliando gli altri giorni non deve comparire niente: sarebbe una
 * informazione falsa su una giornata che non stai vivendo.
 */
function stopOfNow(d){
  const now = new Date();
  const [y, m, gg] = d.date.split("-").map(Number);
  if(now.getFullYear() !== y || now.getMonth()+1 !== m || now.getDate() !== gg) return null;
  const i = currentStopIndex(d.stops, now.getHours()*60 + now.getMinutes());
  return i === null ? null : d.stops[i];
}

/** Accende sulla mappa il segnaposto della tappa di adesso. */
function markNow(){
  const li = document.querySelector(".stop.now");
  if(!li) return;
  const n = +li.dataset.stop;
  frameMarkers.forEach(({ drawn, nums }) => {
    const idx = nums.indexOf(n);
    if(idx < 0) return;
    const el = drawn.markers[idx].getElement();
    if(el && el.firstChild) el.firstChild.classList.add("pin--now");
  });
  // Solo alla prima apertura: dopo, cambiare scheda non deve far saltare la pagina.
  if(primoAvvio){
    primoAvvio = false;
    requestAnimationFrame(() => li.scrollIntoView({ block:"center", behavior:"smooth" }));
  }
}

/** Evidenzia insieme il segnaposto e la scheda, da qualsiasi lato si parta. */
function selectStop(n){
  document.querySelectorAll(".stop.on").forEach(el => el.classList.remove("on"));
  document.querySelectorAll(".pin--on").forEach(el => el.classList.remove("pin--on"));
  const li = document.querySelector('[data-stop="' + n + '"]');
  if (li) {
    li.classList.add("on");
    li.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  frameMarkers.forEach(({ drawn, nums }) => {
    const idx = nums.indexOf(n);
    if (idx < 0) return;
    const pin = drawn.markers[idx].getElement();
    if (pin && pin.firstChild) pin.firstChild.classList.add("pin--on");
  });
}

/** La base vera di un giorno: l'ultima notte "volo serale" non è un posto. */
function baseOf(i){
  const b = DAYS[i].base;
  if (NOMI_BASI.has(b)) return b;
  return i > 0 ? baseOf(i-1) : b;
}

/**
 * Posizione di ogni base, ricavata dalle tappe stesse.
 * Va usato il riquadro, non la giornata: l'11 settembre si dorme a Chengdu ma
 * metà delle tappe sono ancora a Xi'an, e attribuirle tutte a Chengdu piazza
 * Chengdu sopra Xi'an. Le tappe di un riquadro che non è una base (la Muraglia
 * a Jinshanling) non contano per nessuna città.
 */
function baseCentroids(){
  const bag = new Map();
  DAYS.forEach((d, i) => {
    const frames = splitFrames(d.stops);
    const labels = frameLabels(d, frames, DAYS[i-1], NOMI_BASI);
    frames.forEach((f, k) => {
      const b = labels[k];
      if (!NOMI_BASI.has(b)) return;
      if (!bag.has(b)) bag.set(b, []);
      f.forEach(s => { if (s.ll) bag.get(b).push(toGCJ(s.ll)); });
    });
  });
  const med = a => { const v = [...a].sort((x,y) => x-y); return v[Math.floor(v.length/2)]; };
  const out = new Map();
  bag.forEach((pts, b) => {
    if (pts.length) out.set(b, [med(pts.map(p => p[0])), med(pts.map(p => p[1]))]);
  });
  return out;
}

/** Le tratte fra una base e la successiva, con l'indicazione se è un treno. */
function legs(){
  const out = [];
  for (let i = 1; i < DAYS.length; i++) {
    const from = baseOf(i-1), to = baseOf(i);
    if (from !== to) out.push({ from, to, train: !!DAYS[i].tr, day: i });
  }
  return out;
}

function render(){
  // Le mappe vecchie vanno chiuse prima di buttare via il loro contenitore,
  // altrimenti Leaflet resta attaccato a nodi che non esistono più.

  if(tab === "days") renderDay();
  else if(tab === "guida") renderGuida();
  else if(tab === "map") renderOverview();
  else renderLog();

  $("#tabLog").setAttribute("aria-current", tab==="log" ? "page" : "false");
  $("#prev").disabled = (tab!=="days" || day===0);
  $("#next").disabled = (tab!=="days" || day===DAYS.length-1);
}

});

});
let sx = 0, sy = 0, swipeOK = true;
document.addEventListener("touchstart", e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  // Trascinare la mappa è trascinare la mappa, non cambiare giorno.
  swipeOK = !e.target.closest(".map");
}, {passive:true});
document.addEventListener("touchend", e => {
  if(tab !== "days" || !swipeOK) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) go(day + (dx < 0 ? 1 : -1));
}, {passive:true});

render();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
